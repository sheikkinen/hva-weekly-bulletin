[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hva-weekly-bulletin"
version = "0.1.0"
description = "Weekly Finnish wellbeing-services county governance and procurement bulletin"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.50,<2",
    "pydantic>=2.11,<3",
    "yamlgraph>=0.5.22,<0.6",
]

[project.scripts]
hva-collect = "hva_bulletin.collect:main"
hva-publish = "hva_bulletin.publish:main"
hva-weekly-window = "hva_bulletin.weekly_window:main"

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pytest>=8.4,<9",
    "ruff>=0.12,<0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hva_bulletin"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
